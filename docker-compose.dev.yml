version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: legaltrace_postgres_dev
    environment:
      POSTGRES_USER: legaltrace_user
      POSTGRES_PASSWORD: legaltrace_pass
      POSTGRES_DB: legaltrace_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U legaltrace_user -d legaltrace_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - legaltrace_network_dev

  redis:
    image: redis:7-alpine
    container_name: legaltrace_redis_dev
    ports:
      - "6379:6379"
    volumes:
      - redis_data_dev:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - legaltrace_network_dev

volumes:
  postgres_data_dev:
  redis_data_dev:

networks:
  legaltrace_network_dev:
    driver: bridge

